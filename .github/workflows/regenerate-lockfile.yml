name: Regenerate lockfile

# Manual, click-to-run workflow -- lets pnpm-lock.yaml be regenerated
# from GitHub's own UI when nobody has a local pnpm/node environment
# handy. Go to the Actions tab, select "Regenerate lockfile" in the left
# sidebar, click "Run workflow", pick the branch, and click the green
# "Run workflow" button. It resolves dependencies fresh and commits the
# resulting pnpm-lock.yaml straight back to that branch if anything
# changed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "pnpm-lock.yaml already up to date -- nothing to commit."
          else
            git commit -m "Regenerate pnpm-lock.yaml"
            git push origin HEAD:${{ github.ref_name }}
          fi
